<!--
  The app icon: the honeycomb board with the ARK Core fallen at its centre.

  Colours are the ones already in `src/ui/theme.ts` rather than a fourth palette — `#1d1d1d` is
  the page and canvas background declared in `index.html`, `#4da3ff` is `PLAYER_ACCENTS[0]`
  (which `MENU_ACCENT` and `BOARD_COLORS.coach` both are), and the violet core is the sphere's
  own hue from the arena's `arena_ark_core` motes.

  ⚠️ The artwork sits inside the middle 80% so this file can serve as the *maskable* icon too:
  Android crops a maskable icon to whatever shape the launcher uses, and anything outside that
  safe circle is liable to be cut off. `scripts/build-icons.mjs` rasterises this to the PNGs the
  manifest lists; edit here, never the PNGs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2e6ff" />
      <stop offset="45%" stop-color="#b98cff" />
      <stop offset="100%" stop-color="#6d3fb8" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b98cff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#b98cff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="#1d1d1d" />

  <!-- The board: one outer hex ring with the six corner seats marked. -->
  <g transform="translate(256 256)">
    <polygon points="0,-168 145,-84 145,84 0,168 -145,84 -145,-84"
             fill="#25303f" stroke="#4da3ff" stroke-width="10" stroke-linejoin="round" />
    <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52"
             fill="none" stroke="#4da3ff" stroke-width="5" stroke-opacity="0.45"
             stroke-linejoin="round" />

    <!-- Six seats on the corner ring — colour is per seat everywhere in this game. -->
    <circle cx="0" cy="-168" r="17" fill="#4da3ff" />
    <circle cx="145" cy="-84" r="17" fill="#ff6b6b" />
    <circle cx="145" cy="84" r="17" fill="#4cd97b" />
    <circle cx="0" cy="168" r="17" fill="#ffc14d" />
    <circle cx="-145" cy="84" r="17" fill="#b98cff" />
    <circle cx="-145" cy="-84" r="17" fill="#4ad9d9" />

    <!-- The Core on the centre hex. -->
    <circle cx="0" cy="0" r="96" fill="url(#halo)" />
    <circle cx="0" cy="0" r="48" fill="url(#core)" />
  </g>
</svg>
