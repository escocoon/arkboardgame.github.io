<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Energy: the price a cast is charged, as a bolt. Read on the skill tray's cost chip, where it
       replaces the letters "EN" — the glyph is the same width as the two characters it stands in
       for and needs no space for a gap, which is the whole point of it.

       ⚠️ **Filled, not stroked**, unlike every interface icon beside it. A bolt outlined at
       stroke-width 5 closes its own notches at chip size and reads as a lozenge; the silhouette is
       the shape, so the ink has to be the shape too. `status-energized` sets the precedent for a
       solid fill in this set (§3.1's "ink density is the one interior property that survives").

       ⚠️ **Not `status-energized`, which is a battery**, and not a `StatusKind` glyph at all: that
       set names a condition a fighter is *in*, and this names what an action costs. Filing it with
       the interface icons is the same call `hourglass` records — putting it behind `statusIconKey`
       would advertise an "energy" condition nobody can be under.

       ⚠️ Filled #fff like every other icon here is stroked #fff: `setTint` is the whole palette, so
       a shape carrying a colour of its own cannot be re-inked by whoever draws it. -->
  <path d="M37 5 L13 35 H27 L25 59 L51 27 H35 Z" fill="#fff" stroke="#fff" stroke-width="2"
        stroke-linejoin="round"/>
</svg>
