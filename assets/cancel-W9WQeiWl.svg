<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Cancel: a plain cross. Backing out of a target pick, so no circle round it — a ringed
       cross reads as "forbidden", which is a refusal by the rules rather than a change of mind. -->
  <g fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round">
    <path d="M16 16 L48 48"/>
    <path d="M48 16 L16 48"/>
  </g>
</svg>
