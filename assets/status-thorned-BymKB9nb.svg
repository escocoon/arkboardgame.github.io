<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Thorned: a ring of outward spikes — hitting them costs the attacker.
       ⚠️ Outward is the whole glyph. Turned inward it reads as `bleeding` or as a trap closing on
       its holder, which is the opposite of what the status says; and it is a *ring* rather than a
       shield, since `fortified` and `guard` already own that silhouette and this turns nothing
       aside. Kept to six spikes: at chip size a denser ring blurs into a plain circle. -->
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="15"/>
    <path d="M32 17 L32 5"/>
    <path d="M45 24.5 L55.4 18.5"/>
    <path d="M45 39.5 L55.4 45.5"/>
    <path d="M32 47 L32 59"/>
    <path d="M19 39.5 L8.6 45.5"/>
    <path d="M19 24.5 L8.6 18.5"/>
  </g>
</svg>
