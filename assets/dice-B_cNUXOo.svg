<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Two dice, because the board rolls 2d6. The back die is masked out where the
       front one overlaps it, so the pair reads as depth rather than as crossed lines. -->
  <mask id="front-cutout">
    <rect width="64" height="64" fill="#fff"/>
    <rect x="24" y="22" width="38" height="38" rx="10" fill="#000"
          transform="rotate(12 43 41)"/>
  </mask>
  <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round">
    <g mask="url(#front-cutout)" transform="rotate(-14 20 18)">
      <rect x="6" y="4" width="28" height="28" rx="6"/>
      <g fill="#fff" stroke="none">
        <circle cx="13" cy="11" r="2.6"/>
        <circle cx="20" cy="18" r="2.6"/>
        <circle cx="27" cy="25" r="2.6"/>
      </g>
    </g>
    <g transform="rotate(12 43 41)">
      <rect x="28" y="26" width="30" height="30" rx="7"/>
      <g fill="#fff" stroke="none">
        <circle cx="35" cy="33" r="2.9"/>
        <circle cx="51" cy="33" r="2.9"/>
        <circle cx="43" cy="41" r="2.9"/>
        <circle cx="35" cy="49" r="2.9"/>
        <circle cx="51" cy="49" r="2.9"/>
      </g>
    </g>
  </g>
</svg>
