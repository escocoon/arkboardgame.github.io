<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Broken: a ring with a bite taken out of it, the missing arc lying outside the circle.
       ⚠️ **A passive is a *standing* thing, so the icon is a closed shape opened** — not an object
       snapped (`status-disarmed.svg` is the snapped sword and this must not read as a second one),
       and not a negation slash, which is already the vocabulary of a refusal and would say
       "forbidden" rather than "no longer working".
       ⚠️ The gap is wide and on the rim, for `status-disarmed.svg`'s stated reason: at chip size a
       hairline break is noise, and what survives is a shape the eye completes and finds *missing*.
       The displaced arc is what stops it reading as a plain C.
       ⚠️ §3.2: nothing else in the set is a broken ring — `status-barrier.svg` is a closed shield,
       and a ring with its arc still in place would be an ordinary circle. -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- The ring, opened at the upper right. -->
    <path d="M44 15 A21 21 0 1 0 51 36" stroke-width="7"/>
    <!-- The piece that came out of it, fallen clear and turned. -->
    <path d="M52 12 L60 20" stroke-width="6"/>
  </g>
</svg>
