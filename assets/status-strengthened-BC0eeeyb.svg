<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Strengthened: two arrows up, the right one smaller.
       ⚠️ **A 180° pair, and it survives §3.2 only because of the size gradient.** Both are
       "big arrow left, small arrow right", and a point reflection *swaps* left and right — so
       rotating one gives a small-then-big glyph that neither icon is. Direction alone would not
       have been enough. ⚠️ If the two arrows are ever made the same size this pair becomes one
       shape upside down and fails at chip size.
       ⚠️ The heads are deliberately wide and the shafts short. Direction is the primary cue and an
       arrowhead is about 2px in a chip, so a long thin arrow reads as a tick and loses it.
       ⚠️ It no longer builds on attack.svg's blade. That tie to the stat it moves is given up for a
       far more universal glyph — an up arrow is a buff in every game anybody has played — and the
       blade could not carry a legible negative half, which is what the snapped version failed at. -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 52 V24" stroke-width="7"/>
    <path d="M10 33 L22 20 L34 33" stroke-width="7"/>
    <path d="M46 50 V36" stroke-width="5.5"/>
    <path d="M37 42 L46 32 L55 42" stroke-width="5.5"/>
  </g>
</svg>
