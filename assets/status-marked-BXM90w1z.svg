<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Marked: a luggage tag, hung on somebody — a thing put on you that has yet to be settled.
       ⚠️ Deliberately not a reticle or a crosshair, which is the first thing anybody draws for
       "marked": a ring with lines crossing it is `thorned` (a ring with spikes) at chip size, and
       `broken` and `empowered` are both rings too. The tag's silhouette is asymmetric, so it
       survives being 10px tall in a status slot, and nothing else in the set is one.
       ⚠️ And not a clock, an hourglass or a fuse: the icon set bans the first two outright
       (docs/status-icon-prompts.md), and `hourglass` is already the glyph that means "how long any
       status has left" — which would say the duration twice and the mechanic not at all. -->
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 9 H50 A5 5 0 0 1 55 14 V37 L32 58 L6 32 Z"/>
    <circle cx="44" cy="20" r="4.5" fill="#fff" stroke="none"/>
  </g>
</svg>
