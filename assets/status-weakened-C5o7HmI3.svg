<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Weakened: two arrows down, the right one smaller.
       ⚠️ **A 180° pair, and it survives §3.2 only because of the size gradient.** Both are
       "big arrow left, small arrow right", and a point reflection *swaps* left and right — so
       rotating one gives a small-then-big glyph that neither icon is. Direction alone would not
       have been enough. ⚠️ If the two arrows are ever made the same size this pair becomes one
       shape upside down and fails at chip size.
       ⚠️ The heads are deliberately wide and the shafts short. Direction is the primary cue and an
       arrowhead is about 2px in a chip, so a long thin arrow reads as a tick and loses it. -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 12 V40" stroke-width="7"/>
    <path d="M10 31 L22 44 L34 31" stroke-width="7"/>
    <path d="M46 14 V28" stroke-width="5.5"/>
    <path d="M37 22 L46 32 L55 22" stroke-width="5.5"/>
  </g>
</svg>
