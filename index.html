<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` lets the page reach under a notch and under Android's navigation bar;
      the `env(safe-area-inset-*)` padding below is what hands that space back, so nothing is
      drawn beneath the system bars. Pinch-zoom is left enabled here — `touch-action: none` on
      the body *and on the canvas* stops a two-finger board pinch from being read as one, and
      disabling it outright takes browser zoom away from anyone who needs it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Android Chrome: paint the system bars in the game's own background. -->
    <meta name="theme-color" content="#1d1d1d" />
    <meta
      name="description"
      content="A six-seat hex-board race for the fallen ARK Core, with a turn-based arena underneath it."
    />
    <!--
      Installable-app plumbing. Every href is *relative*, for the reason vite.config.ts sets
      `base: './'` — GitHub Pages serves this repo from /ark-board-game/, and a leading slash would
      point at the domain root. See public/manifest.webmanifest and public/sw.js.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <!-- iOS reads none of the manifest's icons; this is the only one it will use. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ARK" />
    <!--
      `black-translucent` puts the iOS status bar over the page rather than beside it, which is
      what makes the `env(safe-area-inset-*)` padding below the thing that positions the canvas —
      one rule for the notch instead of two that can disagree.
    -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>ARK Board Game</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #1d1d1d;
        color: #fff;
        font-family: sans-serif;
        box-sizing: border-box;
        /*
          `100vh` is Android Chrome's *large* viewport: it counts the space behind the
          collapsible toolbar, so the bottom of a 100vh canvas sits off-screen until the toolbar
          is scrolled away — which on a game page never happens. `100dvh` is the space actually
          visible right now. The `100vh` line stays as the fallback for browsers without `dvh`.
        */
        height: 100vh;
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        /* Centres #game once the display-zoom setting shrinks it below 100%. */
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* A drag on the board is a camera pan, not a page scroll. */
        touch-action: none;
        overscroll-behavior: none;
      }
      /*
        Sized in percent, not viewport units, so the display-zoom setting can shrink it by
        writing width/height here — see systems/DisplayScale.ts. Phaser's FIT mode fills
        whatever box this element reports, and the flex centring above keeps it in the middle.
      */
      #game {
        width: 100%;
        height: 100%;
      }
      /*
        ⚠️ `touch-action` is NOT inherited, and the finger lands on the *canvas*, not on the
        body — so the `touch-action: none` above governs nothing that matters here. Phaser
        never sets this property itself (there is no `touchAction` write anywhere in its input
        layer), which leaves the canvas at the default `auto`: the browser is free to claim a
        two-finger gesture as its own page pinch-zoom, and once it has, the touchmove events it
        forwards are flagged non-cancelable — Phaser's own `preventDefault` is guarded on
        `event.cancelable`, so it silently becomes a no-op and the second finger never reaches
        `InputController`. That is the whole of "pinch to zoom does not work on mobile": the
        board's zoom code was never called. Declaring it here stops the browser claiming the
        gesture in the first place, which is the only point at which it can still be refused.
      */
      #game canvas {
        touch-action: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BGiwLHH5.js"></script>
  </head>
  <body>
    <div id="game"></div>
  </body>
</html>
